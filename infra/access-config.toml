# Desk access configuration.
#
# This TOML file holds the module-wide roles and their OIDC-group bindings.
# It is read once at startup; restart the backend after editing.
#
# Access to mailboxes is NOT configured here: every mailbox publishes three
# roles in Desk's role catalog, granted by Keycloak groups that HR manages
# (docs: modules/desk/access):
#
#   desk-<slug>-viewer   read the mailbox's conversations
#   desk-<slug>-manager  reply, note, assign, close, tags, saved replies,
#                        signature and auto-reply
#   desk-<slug>-delete   delete and restore emails and conversations
#
# Permission reference — add new names in internal/domain/domain.go,
# otherwise the loader rejects them.
#
#   mailbox.manage   Desk admin: create, configure, delete and purge
#                    mailboxes; full access to every mailbox of the
#                    organization; retention settings and audit log
#   settings.manage  Den pairing and module settings
#
# A role listed here replaces its built-in permission set entirely.

# Organization (slug) that bindings grant roles in, unless a binding sets
# its own `organization`.
organization = "demo-org"

# -------------------------------------------------------------------------
# Roles
# -------------------------------------------------------------------------

[roles.organization_admin]
description = "Desk admin: creates, configures and deletes mailboxes; full access to every mailbox (read, answer, delete, email any address from them); retention, audit log and module settings."
permissions = [
  "mailbox.manage",
  "settings.manage",
]

# -------------------------------------------------------------------------
# OIDC group → role bindings (organization-wide, evaluated per request:
# removing someone from the group revokes the role on their next request)
# -------------------------------------------------------------------------

[[bindings]]
group = "desk-admin"
role = "organization_admin"
